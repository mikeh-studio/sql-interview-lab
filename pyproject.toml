[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-interview-lab"
version = "0.6.0"
description = "A local SQL interview practice lab with real execution and deterministic grading."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mike H" }]
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "rich>=13.7,<15",
  "sqlglot>=30.13,<31",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.16.3,<0.17",
]

[project.scripts]
sql-lab = "sql_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_lab"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
